[package]
name = "aheui_interpreter"
description = "aheui-interpreter"
authors = ["iubns <iubns@naver.com>"]
version = "0.1.3"
edition = "2021"
repository = "https://github.com/iubns/AHEUI-interpreter"

[package.metadata.commands]
build = "wasm-pack build --target web --out-dir ../aheui_ide/public/aheui-core-wasm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"

wat = { version = "1.240.0", default-features = false }
wasmparser = { version = "0.240.0", default-features = false, features = ["std", "validate"] }

# For exposing structured results to JS via wasm-bindgen
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
	"console",
]


#2가 더 빠름..왜?
[profile.release]
opt-level = 2
lto = true


[profile.test]
opt-level = 2