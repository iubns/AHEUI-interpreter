[package]
name = "wasm-parser"
version = "0.1.0"
edition = "2021"
authors = ["WASM Parser Contributors"]
description = "A WebAssembly WAT parser compiled to WASM for browser usage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-username/wasm-parser"
readme = "README.md"

[package.metadata.commands]
build = "wasm-pack build --target web --out-dir ../aheui_ide/public/wasm-parser"

[lib]
crate-type = ["cdylib"]

[dependencies]
wat = { version = "1.240.0", default-features = false }
wasmparser = { version = "0.240.0", default-features = false, features = ["std", "validate"] }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-mutable-globals"]